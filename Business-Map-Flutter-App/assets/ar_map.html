<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }

        #map { width: 100%; height: 100%; }

        #model-container {
          position: absolute;
          pointer-events: none;
          transform-origin: center center; /* Center of model = anchor point */
          display: none;
        }

        model-viewer {
          width: 100%;
          height: 100%;
          background-color: transparent;
          --progress-bar-color: transparent;
        }


        #hint {
          position: fixed;
          bottom: 36px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0,0,0,0.6);
          color: rgba(255,255,255,0.85);
          font-family: -apple-system, sans-serif;
          font-size: 13px;
          font-weight: 500;
          padding: 9px 20px;
          border-radius: 24px;
          white-space: nowrap;
          pointer-events: none;
          opacity: 0;
          transition: opacity 0.4s;
        }

        #loading {
          position: fixed;
          bottom: 100px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(255,255,255,0.97);
          border-radius: 16px;
          padding: 18px 24px;
          font-family: -apple-system, sans-serif;
          font-size: 13px;
          font-weight: 600;
          color: #333;
          box-shadow: 0 4px 20px rgba(0,0,0,0.15);
          display: flex;
          align-items: center;
          gap: 14px;
          min-width: 220px;
        }

        #loading-bar-wrap {
          width: 100%;
          height: 4px;
          background: #eee;
          border-radius: 4px;
          margin-top: 10px;
          overflow: hidden;
        }

        #loading-bar {
          height: 100%;
          background: #1a73e8;
          border-radius: 4px;
          width: 0%;
          transition: width 0.2s;
        }

        .spinner {
          width: 20px; height: 20px;
          border: 2.5px solid #eee;
          border-top-color: #1a73e8;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
          flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="map"></div>

<div id="model-container">
    <model-viewer
            id="mv"
            alt="AR Model"
            camera-controls
            disable-zoom="false"
            interaction-prompt="none"
            shadow-intensity="0"
            exposure="1"
            camera-target="0m 0m 0m"
            style="background:transparent;"
    ></model-viewer>
</div>

<div id="hint">↺ Rotate map · Pinch to zoom · Drag model to inspect</div>

<div id="loading" style="display:none">
    <div>
        <div style="display:flex;align-items:center;gap:14px">
            <div class="spinner"></div>
            <span id="loading-text">Loading 3D model… 0%</span>
        </div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const LAT       = parseFloat(params.get('lat'));
    const LNG       = parseFloat(params.get('lng'));
    const MODEL_URL = decodeURIComponent(params.get('model') || '');
    const MAPS_KEY  = params.get('key') || '';
    const LOC_NAME  = decodeURIComponent(params.get('name') || 'Location');

    let map, overlay, mv;
    const container = document.getElementById('model-container');

    window.initMap = function() {
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: LAT, lng: LNG },
        zoom: 19,
        tilt: 45,
        heading: 0,
        mapId: '90f87356969d889c',
        disableDefaultUI: false,
        gestureHandling: 'greedy',
        tiltControl: true,
        rotateControl: true,
        mapTypeControl: false,
        isFractionalZoomEnabled: true,
      });

      class ModelOverlay extends google.maps.OverlayView {
        constructor(position, element) {
          super();
          this.position = position;
          this.element  = element;
        }

        onAdd() {
          this.getPanes().overlayMouseTarget.appendChild(this.element);
        }

        draw() {
          const proj = this.getProjection();
          if (!proj) return;

          const point = proj.fromLatLngToDivPixel(this.position);
          if (!point) return;

          const size = this._size || 200;

          this.element.style.left   = (point.x - size / 2) + 'px';
          this.element.style.top    = (point.y - size / 2) + 'px';
          this.element.style.width  = size + 'px';
          this.element.style.height = size + 'px';
          this.element.style.display = 'block';
        }

        setSize(size) {
          this._size = size;
          this.draw();
        }

        onRemove() {
          this.element.parentNode?.removeChild(this.element);
        }
      }

      const modelPosition = new google.maps.LatLng(LAT, LNG);
      overlay = new ModelOverlay(modelPosition, container);
      overlay.setMap(map);

      map.addListener('zoom_changed', updateModelSize);
      map.addListener('tilt_changed', updateModelSize);

      map.addListener('heading_changed', syncModelCamera);
      map.addListener('tilt_changed',    syncModelCamera);

      updateModelSize();
      loadModel();
    };

    function updateModelSize() {
      const zoom = map.getZoom();
      const tilt = map.getTilt() || 0;

      const base   = 200;
      const zoomF  = Math.pow(2, zoom - 19);
      const tiltF  = 0.4 + 0.6 * (tilt / 67.5); // Maps max tilt is 67.5°
      const size   = Math.min(Math.max(base * zoomF * tiltF, 60), 480);

      overlay.setSize(size);
    }

    function syncModelCamera() {
      if (!mv) return;
      const heading = map.getHeading() || 0;
      const tilt    = map.getTilt()    || 0;

      const theta = ((-heading + 180) % 360).toFixed(1);
      const phi   = (8 + (tilt / 67.5) * 75).toFixed(1);

      mv.cameraOrbit = `${theta}deg ${phi}deg 105%`;
      mv.jumpCameraToGoal();
    }

    function loadModel() {
      if (!MODEL_URL) return;

      document.getElementById('loading').style.display = 'flex';

      const script = document.createElement('script');
      script.type = 'module';
      script.src  = 'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js';
      script.onload = () => {
        mv = document.getElementById('mv');

        mv.addEventListener('progress', (e) => {
          const pct = Math.round(e.detail.totalProgress * 100);
          document.getElementById('loading-text').textContent =
            `Loading 3D model… ${pct}%`;
          document.getElementById('loading-bar').style.width = pct + '%';
        });

        mv.addEventListener('load', () => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('hint').style.opacity = '1';
          setTimeout(() => {
            document.getElementById('hint').style.opacity = '0';
          }, 3500);
          syncModelCamera();
          mv.setAttribute('camera-controls', '');
        });

        mv.src = MODEL_URL;
      };
      document.head.appendChild(script);
    }
</script>

<script>
    window.addEventListener('load', () => {
      const s = document.createElement('script');
      s.src = `https://maps.googleapis.com/maps/api/js?key=${MAPS_KEY}&callback=initMap&v=beta`;
      s.async = true;
      document.head.appendChild(s);
    });
</script>

</body>
</html>
