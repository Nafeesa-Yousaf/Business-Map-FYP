name: business_map
description: "Business Map — AI-assisted location intelligence for aspiring entrepreneurs (FYP)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  equatable: ^2.0.7
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.3.0
  google_sign_in: ^7.2.0
  get_it: ^8.2.0
  provider: ^6.1.5+1
  dio: ^5.9.2
  google_maps_flutter: ^2.10.0
  fl_chart: ^1.1.1
  flutter_dotenv: ^6.0.0
  internet_connection_checker_plus: ^2.9.1+2
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5
  intl: ^0.20.2
  # Used by ARFeatureScreen (local WebView + temp directory for loopback assets)
  webview_flutter: ^4.13.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
    - assets/ar_map.html
